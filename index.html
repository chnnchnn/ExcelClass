<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Excel Power Query | ห้องเรียนออนไลน์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="mascot-link" href="https://liff.line.me/2011577141-9ukdVg3q" title="คลิกมาสคอตเพื่อรีเฟรชโปรแกรม">
          <img class="brand-mark" src="assets/mascot-avatar.jpg" alt="Power Bot — คลิกเพื่อรีเฟรชโปรแกรม" />
        </a>
        <a class="brand" href="#start" aria-label="กลับไปหน้าเริ่มต้น">
          <span>Excel Power Query<small>ห้องเรียนออนไลน์</small></span>
        </a>
        <button id="pin-button" class="pin-button" type="button" aria-pressed="false" title="ปักหมุดเมนูให้เปิดค้างไว้">📌</button>
      </div>
      <nav id="chapter-nav" aria-label="บทเรียน"></nav>
      <div class="sidebar-footer">
        <a href="#plan" data-view="plan">แผน 30 วัน</a>
        <a href="#cheatsheet" data-view="cheatsheet">M Cheat Sheet</a>
        <a href="#troubleshoot" data-view="troubleshoot">แก้ปัญหา</a>
        <label class="student-name-field">
          <span>ชื่อของคุณ (สำหรับบันทึกคะแนน)</span>
          <input id="student-name" type="text" placeholder="ชื่อ-นามสกุล" autocomplete="name" />
        </label>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main>
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" aria-label="เปิดเมนู">☰</button>
        <label class="search"><span>⌕</span><input id="search" type="search" placeholder="ค้นหาหัวข้อ เทคนิค หรือคำสั่ง M" /></label>
        <div class="density-switch" role="group" aria-label="ความหนาแน่นของเนื้อหา">
          <button type="button" class="density-option" data-density="normal">Normal</button>
          <button type="button" class="density-option" data-density="compact">Compact</button>
        </div>
        <button class="icon-button" id="theme-button" aria-label="เปลี่ยนโหมดสี" title="เปลี่ยนโหมดสี">◐</button>
      </header>
      <div id="app" class="app"></div>
    </main>
    <template id="toast-template"><div class="toast" role="status"></div></template>
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box" role="dialog" aria-modal="true">
        <button type="button" class="modal-close" id="modal-close" aria-label="ปิด">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>
    <script src="agenda-data.js"></script>
    <script src="slides-data.js"></script>
    <script src="exercises-data.js"></script>
    <script src="assessment-data.js"></script>
